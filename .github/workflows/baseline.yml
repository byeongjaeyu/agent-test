name: Baseline

# 언어와 무관한 최소 안전장치. 스택이 정해지면 린트·테스트 job 을 여기에 추가하세요.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-env-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env 가 커밋되지 않았는지 확인
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 가 커밋되어 있습니다. 토큰이 유출됩니다."
            exit 1
          fi
          echo "OK: .env 는 추적되지 않습니다."
